name: CI/CD
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo libclippy -- -D warnings
      - run: cargo lib
      - run: cargo examplesclippy -- -D warnings
      - run: cargo examples

  # Publishes when the version in Cargo.toml is not on crates.io yet, then tags
  # the commit. Login is crates.io Trusted Publishing: it names this file, so a
  # rename has to be repeated in the crate settings there.
  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sf https://index.crates.io/gd/32/gd32e2-hal | jq -r .vers | grep -qx "$version"; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - if: steps.version.outputs.new == 'true'
        run: cargo publish --features gd32e230c8xx
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
