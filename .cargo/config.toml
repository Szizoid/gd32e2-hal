[build]
target = "thumbv8m.base-none-eabi"
rustflags = ["-C", "link-arg=-Tlink.x"]

# runner = "probe-rs" (???)

[alias]
# Compile-check an example: cargo example usart-echo
example = "build --release --example"
# Produce firmware.bin from src/main.rs (copy the example you want there first
# — `cp examples/usart-echo.rs src/main.rs` — src/main.rs isn't tracked in git).
bin = "objcopy --release -- -O binary firmware.bin"

# cargo objcopy --release --example {example_file} -- -O binary firmware.bin
