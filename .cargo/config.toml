[build]
target = "thumbv8m.base-none-eabi"
# defmt.x must come after link.x: it declares the non-loadable .defmt section
# whose symbol addresses are the string indices sent over RTT.
rustflags = ["-C", "link-arg=-Tlink.x", "-C", "link-arg=-Tdefmt.x"]

# defmt filters log levels at compile time; without this only ERROR survives.
[env]
DEFMT_LOG = "trace"

[target.thumbv8m.base-none-eabi]
runner = "probe-rs run --chip GD32E230K8"

# `lib` and `pubdry` carry the part explicitly: with no default feature, a bare
# `cargo build` or `cargo publish` stops in build.rs, and the [dev-dependencies]
# entry that gives the examples theirs does not apply to the library alone. Both
# name the largest part, which compiles the most code and documents a superset of
# every other one; the real publish needs the same flag.
#
# The example aliases need nothing — building an example pulls dev-dependencies in,
# and that is deliberately the part on the bench rather than the largest one: `re`
# flashes the board, where a pin map for 48 pins would be a lie.
[alias]
lib = "build --features gd32e230c8xx"
pubdry = "publish --dry-run --features gd32e230c8xx"
be = "build --example"
bre = "build --release --example"
re = "run --release --example"
