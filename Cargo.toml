[package]
name = "gd32e2-hal"
version = "0.5.1"
edition = "2024"
authors = ["Szizoid"]
description = "HAL for the GD32E23x series (Cortex-M23), currently the GD32E230"

# Chip variant within the GD32E230x series. These gate the alternate-function
# map: the same pin+AF maps to different peripherals depending on the variant
# (datasheet Table 2-13/2-14 notes 1/2/3). Mutually exclusive; exactly one must
# be enabled (enforced by a compile_error! in lib.rs).
#   gd32e230x4 -> note (1), GD32E230x4 only
#   gd32e230x6 -> note (2), GD32E230x8/6
#   gd32e230x8 -> notes (2) and (3), GD32E230x8 (our GD32E230K8U6)
[features]
default = ["gd32e230x8"]
gd32e230x4 = []
gd32e230x6 = []
gd32e230x8 = []

[dependencies]
# The library itself only calls cortex_m::asm::delay (adc.rs); the
# critical-section impl is an examples-only concern, see [dev-dependencies].
cortex-m = "0.7.7"
# Trait-only interface so portable drivers work against our Pin types.
embedded-hal = "1.0"
# Non-blocking serial traits, split out of embedded-hal since 1.0.
embedded-hal-nb = "1.0"
# nb::Result/Error, used by embedded-hal-nb's trait signatures.
nb = "1.0"
# PAC for the GD32E2 family: gd32e230 = our chip, rt = interrupt vectors,
# critical-section = safe interrupt-free register access.
gd32e2 = { version = "0.9.1", features = ["gd32e230", "rt", "critical-section"] }

# Needed only to link a runnable binary, i.e. examples/: the reset handler and
# vector table, a #[panic_handler], and an impl for the critical-section that
# gd32e2's `critical-section` feature requires. Cargo unifies features across
# dependency kinds, so naming cortex-m here just adds the impl feature on top of
# the plain dependency above.
[dev-dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"

# Small, predictable binary. debug = true costs no flash — probe-rs only loads
# the loadable sections — and is what gives symbols to `probe-rs gdb`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
overflow-checks = false

[profile.dev]
opt-level = 1
