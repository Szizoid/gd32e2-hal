[package]
name = "gd32e2-hal"
version = "0.13.0"
edition = "2024"
authors = ["Szizoid"]
description = "HAL for the GD32E23x series (Cortex-M23), currently the GD32E230"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Szizoid/gd32e2-hal"
keywords = ["gd32", "gd32e230", "cortex-m", "hal", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std", "no-std::no-alloc"]
exclude = [".cargo", ".gitignore", "docs", "memory.x.example", "rust-toolchain.toml"]

[package.metadata.docs.rs]
default-target = "thumbv8m.base-none-eabi"
targets = []
features = ["defmt"]

# Chip variant within the GD32E230x series. These gate the alternate-function
# map: the same pin+AF maps to different peripherals depending on the variant
# (datasheet Table 2-13/2-14 notes 1/2/3). Mutually exclusive; exactly one must
# be enabled (enforced by a compile_error! in lib.rs).
#   gd32e230x4 -> note (1), GD32E230x4 only
#   gd32e230x6 -> note (2), GD32E230x8/6
#   gd32e230x8 -> notes (2) and (3), GD32E230x8 (our GD32E230K8U6)
[features]
default = ["gd32e230x8"]
gd32e230x4 = []
gd32e230x6 = []
gd32e230x8 = []

# Derives defmt::Format on the public enums so they can be logged. Off by
# default: a user who does not log with defmt should not pull the crate in.
defmt = ["dep:defmt", "embedded-hal/defmt-03"]

[dependencies]
# Only ever named inside cfg_attr(feature = "defmt", ...), see [features].
defmt = { version = "1.1", optional = true }
# The library itself only calls cortex_m::asm::delay (adc.rs); the
# critical-section impl is an examples-only concern, see [dev-dependencies].
cortex-m = "0.7.7"
# Trait-only interface so portable drivers work against our Pin types.
embedded-hal = "1.0"
# Non-blocking serial traits, split out of embedded-hal since 1.0.
embedded-hal-nb = "1.0"
# Byte-stream traits over USART. embedded-hal has no serial traits of its own
# and points here for them; unlike embedded-hal-nb these are buffer-oriented
# and always blocking.
embedded-io = "0.7.1"
# nb::Result/Error, used by embedded-hal-nb's trait signatures.
nb = "1.0"
# PAC for the GD32E2 family: gd32e230 = our chip, rt = interrupt vectors,
# critical-section = safe interrupt-free register access.
gd32e2 = { version = "0.9.1", features = ["gd32e230", "rt", "critical-section"] }
# Integer-only time units: rates and durations as distinct kinds, with the
# scale carried in the type. Replaces the newtypes `time` used to define.
fugit = "0.4.0"

# Needed only to link a runnable binary, i.e. examples/: the reset handler and
# vector table, a #[panic_handler], and an impl for the critical-section that
# gd32e2's `critical-section` feature requires. Cargo unifies features across
# dependency kinds, so naming cortex-m here just adds the impl feature on top of
# the plain dependency above.
[dev-dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.3"
panic-halt = "0.2.0"
# Logging for the examples: defmt keeps only a string index plus raw argument
# bytes on the target, defmt-rtt drains them into the RTT ring buffer that
# `probe-rs run` reads over SWD.
defmt = "1.1"
defmt-rtt = "1.3"
# The crate depending on itself is not a cycle: this entry applies to examples
# only, and it is the one way to build them with a feature of the library
# enabled. Without it the examples cannot log our own error types.
gd32e2-hal = { path = ".", features = ["defmt"] }

# Small, predictable binary. debug = true costs no flash — probe-rs only loads
# the loadable sections — and is what gives symbols to `probe-rs gdb`.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
overflow-checks = false

[profile.dev]
opt-level = 1
